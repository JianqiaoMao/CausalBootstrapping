[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalbootstrapping"
version = "0.2.6"
description = "Causal identification and weighted empirical resampling for causal analysis."
requires-python = ">=3.9"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [{name = "Jianqiao Mao", email = "jxm1417@student.bham.ac.uk"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.25,<3",
  "scipy>=1.13.1,<2",
  "grapl-causal==1.6.1",
  "graphviz>=0.20.3,<1",
  "sympy>=1.13.1,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]
demo = ["pandas>=1.5,<3", "matplotlib>=3.7,<4", "jupyterlab>=4,<5"]
dev = ["build>=1,<2", "twine>=5,<7", "nbformat>=5,<6"]

[project.urls]
Homepage = "https://github.com/JianqiaoMao/CausalBootstrapping"
Repository = "https://github.com/JianqiaoMao/CausalBootstrapping"
Issues = "https://github.com/JianqiaoMao/CausalBootstrapping/issues"

[tool.setuptools.packages.find]
include = ["causalbootstrapping*"]
exclude = ["tests*", "test_scr*", "examples*"]
